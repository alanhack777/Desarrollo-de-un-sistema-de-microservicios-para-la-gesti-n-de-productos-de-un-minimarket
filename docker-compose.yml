version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_minimarket_pro413
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: db_minimarket_pro413
      MYSQL_USER: ${MYSQL_USER:-user_minimarket}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-userpass}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - minimarket_net

volumes:
  mysql_data:

networks:
  minimarket_net:
    driver: bridge